<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help — DevShowcase</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <style>
    :root {
      --bg: #060811;
      --bg2: #0b0e1a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass2: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.13);
      --a1: #7c6efa;
      --a2: #06d6a0;
      --text: #f0f2ff;
      --muted: #6b7280;
      --muted2: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Syne", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%,
          rgba(124, 110, 250, 0.1),
          transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 90%,
          rgba(6, 214, 160, 0.07),
          transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      height: 60px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 8, 17, 0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .logo-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--a1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--glass);
      border: 1px solid var(--border2);
      color: var(--muted2);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-back:hover {
      color: var(--text);
    }

    .chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 20px 5%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .chat-wrap::-webkit-scrollbar {
      width: 3px;
    }

    .chat-wrap::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .welcome {
      text-align: center;
      padding: 20px 0 10px;
    }

    .welcome-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(124, 110, 250, 0.3);
    }

    .welcome h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto 16px;
    }

    .quick-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .q-btn {
      padding: 7px 13px;
      border-radius: 100px;
      background: rgba(124, 110, 250, 0.08);
      border: 1px solid rgba(124, 110, 250, 0.2);
      color: #9b8fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Syne", sans-serif;
      font-weight: 500;
    }

    .q-btn:hover {
      background: rgba(124, 110, 250, 0.16);
      border-color: rgba(124, 110, 250, 0.35);
    }

    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.87rem;
      line-height: 1.65;
      animation: msgIn 0.3s ease;
      white-space: pre-wrap;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.bot {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      color: var(--text);
    }

    .msg.user {
      background: rgba(124, 110, 250, 0.12);
      border: 1px solid rgba(124, 110, 250, 0.2);
      border-bottom-right-radius: 3px;
      align-self: flex-end;
      color: var(--text);
    }

    .msg.typing {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

    .t-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }

    .t-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .t-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      padding: 12px 5% 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      background: rgba(6, 8, 17, 0.5);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 700px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      padding: 11px 14px;
      background: var(--glass2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      color: var(--text);
      font-family: "Syne", sans-serif;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: rgba(124, 110, 250, 0.4);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--a1), #5b52d6);
      border: none;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(124, 110, 250, 0.35);
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .input-hint {
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: 0.5px;
    }
  </style>
</head>

  <script>

    function addMsg(text, type) {
      var wrap = document.getElementById("chatWrap");
      var div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

    function addTyping() {
      var wrap = document.getElementById("chatWrap");
      var div = document.createElement("div");
      div.className = "msg typing";
      div.id = "typing";
      div.innerHTML =
        '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
    }

    function addMsgHTML(html, type) {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = 'msg ' + type;
      div.innerHTML = html;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

          "Unataka kuwasiliana nasi? Hivi ndivyo:\n\n📱 WhatsApp: wa.me/255618811359\n📧 Barua pepe: devshowcase@gmail.com\n\nTuko Mwanza, Tanzania 🇹🇿 — jibu ndani ya masaa 24!"
        ],
        about: [
          "DevShowcase ni platform ya kimataifa ya portfolio ya wasanidi, iliyojengwa na BraxCode Digitals Foundation, Mwanza, Tanzania 🇹🇿\n\nDhamira yetu: Kusaidia wasanidi wa Afrika kugunduliwa na kuajiriwa na wateja duniani kote! 🌍"
        ],
        default: [
          "Sijaelewana nawe vizuri. Jaribu kuuliza kuhusu:\n• Kuongeza mradi\n• Kupata kazi\n• Kubadilisha wasifu\n• WhatsApp ya mawasiliano\n• Maoni na kura\n\nAu wasiliana nasi moja kwa moja! 😊",
          "Sijapata vizuri swali lako. Unaweza kuuliza tena? Au wasiliana na timu yetu kupitia WhatsApp kwa msaada wa kibinafsi! 🙏"
        ]
      }
    };

    function detectLang(text) {
      const sw = ['habari', 'nianze', 'wapi', 'sijui', 'jinsi', 'nini', 'vipi', 'sema', 'nataka', 'ninaweza', 'asante', 'tafadhali', 'mradi', 'dashboard', 'kazi', 'bure', 'jisajili', 'wasifu', 'namba', 'nenosiri', 'bonyeza', 'nenda', 'ongeza', 'futa', 'pakia', 'karibu', 'hujambo', 'mambo', 'salamu', 'sijapata', 'niambie', 'naomba', 'msaada', 'taarifa', 'picha', 'wasifu', 'gallery', 'explore'];
      const lower = text.toLowerCase();
      const score = sw.filter(w => lower.includes(w)).length;
      return score >= 1 ? 'sw' : 'en';
    }

    function matchIntent(text, lang) {
      const t = text.toLowerCase();
      const L = KB[lang];

      if (/hi|hello|hey|hujambo|habari|salaam|mambo|karibu|sup|good/.test(t)) return L.greeting;
      if (/free|bei|malipo|cost|charge|pesa|gharama|tosha/.test(t)) return L.free;
      if (/avatar|photo|picha|image|profile pic|selfie|dp/.test(t)) return L.avatar;
      if (/add|upload|post|ongeza|pakia|weka|publish|mradi|project|new project/.test(t)) return L.addproject;
      if (/edit|update|change|badilisha|hariri|rekebisha/.test(t) && /project|mradi/.test(t)) return L.edit;
      if (/delete|remove|futa|ondoa|trash/.test(t)) return L.delete;
      if (/hired|hire|job|kazi|client|mteja|pata kazi|kupata kazi|found|ajira/.test(t)) return L.gethired;
      if (/contact|wasiliana|reach|chat|message/.test(t) && !/us|sisi|team/.test(t)) return L.contact;
      if (/contact us|wasiliana nasi|reach us|support|help team|timu/.test(t)) return L.contact_us;
      if (/whatsapp|namba|number|phone|simu/.test(t)) return L.whatsapp;
      if (/sign|signup|register|jisajili|create account|akaunti|account|new account/.test(t)) return L.signup;
      if (/profile|wasifu|edit profile|bio|skills|ujuzi/.test(t)) return L.profile;
      if (/react|reaction|like|fire|clap|kura|vote/.test(t)) return L.reactions;
      if (/comment|maoni|feedback|jibu/.test(t)) return L.comments;
      if (/notif|taarifa|bell|kengele|alert/.test(t)) return L.notifications;
      if (/location|mahali|gps|detect|country|nchi|city|mji/.test(t)) return L.location;
      if (/password|nenosiri|forgot|reset|sahau|lock/.test(t)) return L.password;
      if (/share|shiriki|link|kiungo|send profile/.test(t)) return L.share;
      if (/gallery|explore|browse|tafuta|search|filter/.test(t)) return L.gallery;
      if (/pro|badge|featured|premium|paid|listing/.test(t)) return L.pro;
      if (/tech|stack|teknolojia|framework|language|lugha ya/.test(t)) return L.tech;
      if (/image|screenshot|picha|photo|upload image|2mb/.test(t)) return L.image;
      if (/about|nini|what is|platform|devshowcase|braxcode/.test(t)) return L.about;
      return L.default;
    }

    async function send() {
      var inp = document.getElementById('inp');
      var text = inp.value.trim();
      if (!text) return;

      inp.value = '';
      inp.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      addMsg(text, 'user');
      addTyping();

      await new Promise(r => setTimeout(r, 600 + Math.random() * 500));

      var loader = document.getElementById('typing');
      if (loader) loader.remove();

      const lang = detectLang(text);
      const responses = matchIntent(text, lang);
      const reply = responses[Math.floor(Math.random() * responses.length)];

      // Contact us — make WhatsApp clickable
      const finalReply = reply.replace(
        'wa.me/255618811359',
        '<a href="https://wa.me/255618811359" target="_blank" style="color:var(--a2);text-decoration:underline;">wa.me/255618811359</a>'
      ).replace(
        'devshowcase@gmail.com',
        '<a href="mailto:devshowcase@gmail.com" style="color:var(--a2);text-decoration:underline;">devshowcase@gmail.com</a>'
      );

      addMsgHTML(finalReply, 'bot');
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('inp').focus();
    }

    function ask(q) { document.getElementById('inp').value = q; send(); }
    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
    function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
  </script>
</body>
