<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help — DevShowcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <style>
    :root {
      --bg: #060811;
      --bg2: #0b0e1a;
      --glass: rgba(255,255,255,0.04);
      --glass2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --a1: #7c6efa;
      --a2: #06d6a0;
      --text: #f0f2ff;
      --muted: #6b7280;
      --muted2: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Syne", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%, rgba(124,110,250,0.1), transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(6,214,160,0.07), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      height: 60px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6,8,17,0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .logo-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--a1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--glass);
      border: 1px solid var(--border2);
      color: var(--muted2);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-back:hover { color: var(--text); }

    /* CHAT */
    .chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 20px 5%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .chat-wrap::-webkit-scrollbar { width: 3px; }
    .chat-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* WELCOME */
    .welcome {
      text-align: center;
      padding: 20px 0 10px;
    }

    .welcome-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(124,110,250,0.3);
    }

    .welcome h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }

    .welcome p {
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto 4px;
    }

    /* AI badge */
    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(6,214,160,0.08);
      border: 1px solid rgba(6,214,160,0.2);
      color: var(--a2);
      font-size: 0.68rem;
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .ai-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--a2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .quick-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .q-btn {
      padding: 7px 13px;
      border-radius: 100px;
      background: rgba(124,110,250,0.08);
      border: 1px solid rgba(124,110,250,0.2);
      color: #9b8fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Syne", sans-serif;
      font-weight: 500;
    }

    .q-btn:hover {
      background: rgba(124,110,250,0.16);
      border-color: rgba(124,110,250,0.35);
    }

    /* MESSAGES */
    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.87rem;
      line-height: 1.65;
      animation: msgIn 0.3s ease;
      white-space: pre-wrap;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.bot {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      color: var(--text);
    }

    /* AI replied — subtle green tint */
    .msg.bot.ai {
      border-color: rgba(6,214,160,0.15);
      background: rgba(6,214,160,0.04);
    }

    .msg.bot.ai::after {
      content: "✦ AI";
      display: block;
      font-size: 0.6rem;
      font-family: "JetBrains Mono", monospace;
      color: rgba(6,214,160,0.45);
      margin-top: 6px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .msg.user {
      background: rgba(124,110,250,0.12);
      border: 1px solid rgba(124,110,250,0.2);
      border-bottom-right-radius: 3px;
      align-self: flex-end;
      color: var(--text);
    }

    .msg.typing {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

    .t-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .t-dot:nth-child(2) { animation-delay: 0.2s; }
    .t-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* INPUT */
    .input-area {
      padding: 12px 5% 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      background: rgba(6,8,17,0.5);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 700px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      padding: 11px 14px;
      background: var(--glass2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      color: var(--text);
      font-family: "Syne", sans-serif;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: rgba(124,110,250,0.4); }
    textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--a1), #5b52d6);
      border: none;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(124,110,250,0.35);
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .input-hint {
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="logo-icon"><i class="fa solid fa-bolt"></i></div>
      <span class="logo-text">DevShowcase</span>
    </a>
    <a href="devshowcase-gallery.html" class="nav-back">
      <i class="fa-solid fa-arrow-left"></i> Back
    </a>
  </nav>

  <div class="chat-wrap" id="chatWrap">
    <div class="welcome">
      <div class="welcome-avatar">🤖</div>
      <h2>DevAssist</h2>
      <p>Ask me anything about the platform</p>
      <div class="ai-badge">
        <div class="dot"></div>
        AI-Powered
      </div>
      <div class="quick-grid">
        <button class="q-btn" onclick="ask('How do I add a project?')">➕ Add project</button>
        <button class="q-btn" onclick="ask('How do I get hired?')">💼 Get hired</button>
        <button class="q-btn" onclick="ask('Is DevShowcase free?')">💸 Is it free?</button>
        <button class="q-btn" onclick="ask('How do clients contact me?')">📱 Client contact</button>
        <button class="q-btn" onclick="ask('How do I edit my profile?')">✏️ Edit profile</button>
        <button class="q-btn" onclick="ask('How do reactions work?')">🔥 Reactions</button>
        <button class="q-btn" onclick="ask('Contact us')">📞 Contact us</button>
        <button class="q-btn" onclick="ask('Nianze wapi?')">🇹🇿 Nianze wapi?</button>
        <button class="q-btn" onclick="ask('DevShowcase ni nini?')">🌍 DS ni nini?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="inp" placeholder="Ask anything..." rows="1"
        onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
    <div class="input-hint">
      Powered by <a href="https://braxcode.com" style="color:var(--a1);text-decoration:none;">BraxCode Digitals Foundation</a>
      <i class="fa solid fa-bolt"></i>
    </div>
  </div>

  <script>
    // ─── CONVERSATION HISTORY (for AI context) ───────────────────────────────
    var history = [];

    // ─── LOCAL KNOWLEDGE BASE (fast + offline) ────────────────────────────────
    var KB = {
      en: {
        greeting:    ["Hi! 👋 I'm DevAssist, your DevShowcase helper. What can I help you with today?"],
        free:        ["Yes! DevShowcase is 100% free to use. Sign up, add your projects, and get discovered by clients worldwide — no cost at all! 🚀"],
        addproject:  ["To add a project:\n1. Sign in → Dashboard\n2. Click 'Add Project'\n3. Upload a screenshot (JPG/PNG/WebP, max 2MB)\n4. Fill in title, description, tech stack\n5. Hit Publish! 🎉\n\nYour project appears in the gallery immediately."],
        gethired:    ["To get hired:\n1. Complete your profile 100%\n2. Add your WhatsApp number ← crucial!\n3. Upload quality project screenshots\n4. Write clear descriptions\n\nClients browse the gallery and contact you directly via WhatsApp 💼"],
        contact:     ["Clients contact you directly via WhatsApp — no middleman, no commission! Make sure your WhatsApp number is saved: Dashboard → Profile → Edit. 📱"],
        profile:     ["To edit your profile:\n1. Dashboard → Profile → Edit\n2. Update name, role, bio, skills, WhatsApp, GitHub, LinkedIn\n3. Click 'Save Changes' ✅"],
        reactions:   ["Visitors can react with 👍 Like, 🔥 Fire, or 👏 Clap. More reactions = more visibility in the gallery!"],
        contact_us:  ["Need to reach us?\n\n📱 WhatsApp: wa.me/255618811359\nWe're in Mwanza, Tanzania 🇹🇿 — response within 24 hours!"],
        about:       ["DevShowcase is a global developer portfolio platform by BraxCode Digitals Foundation, Mwanza 🇹🇿\n\nHelping African developers get discovered and hired worldwide! 🌍"],
      },
      sw: {
        greeting:    ["Habari! 👋 Mimi ni DevAssist. Ninawezaje kukusaidia leo?"],
        free:        ["Ndiyo! DevShowcase ni bure kabisa. Jisajili, ongeza miradi, ugunduliwe na wateja duniani kote — bila malipo! 🚀"],
        addproject:  ["Kuongeza mradi:\n1. Ingia → Dashboard\n2. Bonyeza 'Add Project'\n3. Pakia picha (JPG/PNG/WebP, max 2MB)\n4. Jaza maelezo na teknolojia\n5. Bonyeza Publish! 🎉\n\nMradi wako utaonekana gallery mara moja."],
        gethired:    ["Kupata kazi:\n1. Kamilisha wasifu wako 100%\n2. Weka namba ya WhatsApp ← muhimu sana!\n3. Pakia picha nzuri za miradi\n4. Andika maelezo mazuri\n\nWateja wanakuwasiliana moja kwa moja kupitia WhatsApp 💼"],
        contact:     ["Wateja wanakuwasiliana nawe moja kwa moja kupitia WhatsApp — hakuna mtu wa kati, hakuna kamisheni! Weka namba yako: Dashboard → Profile → Edit. 📱"],
        profile:     ["Kubadilisha wasifu:\n1. Dashboard → Profile → Edit\n2. Badilisha jina, wadhifa, bio, ujuzi, WhatsApp, GitHub\n3. Bonyeza 'Save Changes' ✅"],
        reactions:   ["Wageni wanaweza kupiga kura:\n👍 Like  🔥 Fire  👏 Clap\n\nKura zaidi = uonekano zaidi kwenye gallery!"],
        contact_us:  ["Unataka kuwasiliana nasi?\n\n📱 WhatsApp: wa.me/255618811359\nTuko Mwanza, Tanzania 🇹🇿 — jibu ndani ya masaa 24!"],
        about:       ["DevShowcase ni platform ya kimataifa ya portfolio, iliyojengwa na BraxCode Digitals Foundation, Mwanza 🇹🇿\n\nDhamira: Kusaidia wasanidi wa Afrika kugunduliwa na kuajiriwa duniani kote! 🌍"],
      }
    };

    // ─── LANGUAGE DETECTION ───────────────────────────────────────────────────
    function detectLang(text) {
      var swWords = ['habari','nianze','wapi','jinsi','nini','vipi','nataka','ninaweza','tafadhali',
        'mradi','kazi','bure','jisajili','wasifu','namba','nenosiri','bonyeza','nenda',
        'ongeza','futa','pakia','karibu','hujambo','mambo','msaada','picha','gallery',
        'wasanidi','wateja','kuwasiliana','platform','mwanza','safari'];
      var lower = text.toLowerCase();
      return swWords.filter(function(w){ return lower.includes(w); }).length >= 1 ? 'sw' : 'en';
    }

    // ─── LOCAL INTENT MATCH ───────────────────────────────────────────────────
    // Returns KB reply array or null (null = send to AI)
    function matchLocal(text, lang) {
      var t = text.toLowerCase();
      var L = KB[lang];

      if (/hi\b|hello|hey|hujambo|habari|salaam|mambo|karibu|good (morning|evening|afternoon)/.test(t)) return L.greeting;
      if (/\bfree\b|bei|malipo|cost|charge|gharama/.test(t)) return L.free;
      if (/add|upload|post|ongeza|pakia|publish|new project/.test(t) && /project|mradi/.test(t)) return L.addproject;
      if (/(nianze|start|begin|jinsi ya kuanza|how do i start)/.test(t)) return L.addproject;
      if (/hired|hire|job|kazi|client|mteja|pata kazi|ajira/.test(t)) return L.gethired;
      if (/contact us|wasiliana nasi|reach us|support team|timu/.test(t)) return L.contact_us;
      if (/contact|wasiliana|reach|chat/.test(t) && !/us|sisi|team/.test(t)) return L.contact;
      if (/profile|wasifu|bio|edit profile/.test(t)) return L.profile;
      if (/react|reaction|like|fire|clap|kura|vote/.test(t)) return L.reactions;
      if (/about|nini|what is devshowcase|braxcode|platform/.test(t)) return L.about;

      return null; // → goes to AI
    }

    // ─── AI CALL via Vercel API route ─────────────────────────────────────────
    async function callAI(message) {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, history: history })
      });

      if (!res.ok) throw new Error('API error ' + res.status);
      var data = await res.json();
      return data.reply;
    }

    // ─── DOM HELPERS ──────────────────────────────────────────────────────────
    function addMsg(text, type) {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = text;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

    function addMsgHTML(html, type) {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = 'msg ' + type;
      div.innerHTML = html;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

    function addTyping() {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = 'msg typing';
      div.id = 'typing';
      div.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
    }

    function removeTyping() {
      var el = document.getElementById('typing');
      if (el) el.remove();
    }

    function linkify(text) {
      return text
        .replace('wa.me/255618811359',
          '<a href="https://wa.me/255618811359" target="_blank" style="color:var(--a2);text-decoration:underline;">wa.me/255618811359</a>')
        .replace('devshowcase@gmail.com',
          '<a href="mailto:braxtonbruzzzy@gmail.com" style="color:var(--a2);text-decoration:underline;">devshowcase@gmail.com</a>');
    }

    // ─── MAIN SEND ────────────────────────────────────────────────────────────
    async function send() {
      var inp = document.getElementById('inp');
      var text = inp.value.trim();
      if (!text) return;

      inp.value = '';
      inp.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      addMsg(text, 'user');

      // Add to history for AI context
      history.push({ role: 'user', content: text });
      // Keep history lean
      if (history.length > 12) history = history.slice(-12);

      addTyping();

      var reply = '';
      var isAI = false;

      try {
        var lang = detectLang(text);
        var localMatch = matchLocal(text, lang);

        if (localMatch) {
          // ── Bot path: answer from KB instantly ──
          await new Promise(function(r){ setTimeout(r, 400 + Math.random() * 300); });
          reply = localMatch[Math.floor(Math.random() * localMatch.length)];
        } else {
          // ── AI path: call Vercel API ──
          reply = await callAI(text);
          isAI = true;
        }
      } catch (err) {
        // Fallback if AI call fails
        var lang2 = detectLang(text);
        reply = lang2 === 'sw'
          ? 'Samahani, kuna tatizo kidogo. Jaribu tena au wasiliana nasi: wa.me/255618811359 📱'
          : 'Sorry, something went wrong. Please try again or contact us: wa.me/255618811359 📱';
      }

      removeTyping();

      // Add assistant reply to history
      history.push({ role: 'assistant', content: reply });

      var htmlReply = linkify(reply);
      addMsgHTML(htmlReply, isAI ? 'msg bot ai' : 'msg bot');

      document.getElementById('sendBtn').disabled = false;
      document.getElementById('inp').focus();
    }

    function ask(q) { document.getElementById('inp').value = q; send(); }
    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
    function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
  </script>
</body>
</html>
