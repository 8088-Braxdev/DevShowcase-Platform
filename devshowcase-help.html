  <style>
    :root {
      --bg: #060811;
      --bg2: #0b0e1a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass2: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.13);
      --a1: #7c6efa;
      --a2: #06d6a0;
      --text: #f0f2ff;
      --muted: #6b7280;
      --muted2: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Syne", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%, rgba(124, 110, 250, 0.1), transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(6, 214, 160, 0.07), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      height: 60px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 8, 17, 0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .logo-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--a1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--glass);
      border: 1px solid var(--border2);
      color: var(--muted2);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-back:hover {
      color: var(--text);
    }

    .chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 20px 5%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .chat-wrap::-webkit-scrollbar {
      width: 3px;
    }

    .chat-wrap::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .welcome {
      text-align: center;
      padding: 20px 0 10px;
    }

.welcome-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  color: #fff;
  margin: 0 auto 12px;
  box-shadow: 0 8px 24px rgba(124, 110, 250, 0.3);
}

    .welcome h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 0.82rem;
      color: var(--muted2);
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto 4px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(6, 214, 160, 0.08);
      border: 1px solid rgba(6, 214, 160, 0.2);
      color: var(--a2);
      font-size: 0.68rem;
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .ai-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--a2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .quick-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .q-btn {
      padding: 7px 13px;
      border-radius: 100px;
      background: rgba(124, 110, 250, 0.08);
      border: 1px solid rgba(124, 110, 250, 0.2);
      color: #9b8fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Syne", sans-serif;
      font-weight: 500;
    }

    .q-btn:hover {
      background: rgba(124, 110, 250, 0.16);
      border-color: rgba(124, 110, 250, 0.35);
    }

    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.87rem;
      line-height: 1.65;
      animation: msgIn 0.3s ease;
      white-space: pre-wrap;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.bot {
      background: rgba(6, 214, 160, 0.04);
      border: 1px solid rgba(6, 214, 160, 0.15);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      color: var(--text);
    }

    .msg.bot::after {
      content: "✦ AI";
      display: block;
      font-size: 0.6rem;
      font-family: "JetBrains Mono", monospace;
      color: rgba(6, 214, 160, 0.4);
      margin-top: 6px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .msg.user {
      background: rgba(124, 110, 250, 0.12);
      border: 1px solid rgba(124, 110, 250, 0.2);
      border-bottom-right-radius: 3px;
      align-self: flex-end;
      color: var(--text);
    }

    .msg.error {
      background: rgba(255, 80, 80, 0.07);
      border: 1px solid rgba(255, 80, 80, 0.2);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      color: #ff9999;
      font-size: 0.82rem;
    }

    .msg.typing {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

.q-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.q-btn i {
  font-size: 0.75rem;
  color: var(--a2);
}
    .t-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--a2);
      animation: bounce 1.2s infinite;
    }

    .t-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .t-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.3;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      padding: 12px 5% 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      background: rgba(6, 8, 17, 0.5);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 700px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      padding: 11px 14px;
      background: var(--glass2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      color: var(--text);
      font-family: "Syne", sans-serif;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: rgba(124, 110, 250, 0.4);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--a1), #5b52d6);
      border: none;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(124, 110, 250, 0.35);
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .input-hint {
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="logo-icon"><i class="fa solid fa-bolt"></i></div>
      <span class="logo-text">DevShowcase</span>

  <div class="chat-wrap" id="chatWrap">
    <div class="welcome">
   <div class="welcome-avatar"><i class="fa-solid fa-robot"></i></div>
      <h2>DevAssist</h2>
      <p>Ask me anything about the platform</p>
      <div class="ai-badge">
        <div class="dot"></div>
        AI-Powered
      </div>
<div class="quick-grid">
  <button class="q-btn" onclick="ask('How do I add a project?')"><i class="fa-solid fa-plus"></i> Add project</button>
  <button class="q-btn" onclick="ask('How do I get hired?')"><i class="fa-solid fa-briefcase"></i> Get hired</button>
  <button class="q-btn" onclick="ask('Is DevShowcase free?')"><i class="fa-solid fa-sack-dollar"></i> Is it free?</button>
  <button class="q-btn" onclick="ask('How do clients contact me?')"><i class="fa-solid fa-mobile-screen"></i> Client contact</button>
  <button class="q-btn" onclick="ask('How do I edit my profile?')"><i class="fa-solid fa-pen"></i> Edit profile</button>

</div>
    </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="inp" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)"
        oninput="resize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
    <div class="input-hint">
      Powered by <a href="https://braxcode.com" style="color:var(--a1);text-decoration:none;">BraxCode Digitals
        Foundation</a>
      <i class="fa solid fa-bolt"></i>
    </div>
  </div>

  <script>
    var chatHistory = [];
    var isBusy = false;

    // ── DOM helpers ──────────────────────────────────────────────────────────

    function addMsg(text, cls) {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

    function addMsgHTML(html, cls) {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = cls;
      div.innerHTML = html;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
      return div;
    }

    function showTyping() {
      var wrap = document.getElementById('chatWrap');
      var div = document.createElement('div');
      div.className = 'msg typing';
      div.id = 'typingDot';
      div.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById('typingDot');
      if (el) el.remove();
    }

 function linkify(text) {
  var escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // **bold** -> <b>
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

  // wa.me links -> clickable
  escaped = escaped.replace(/(https?:\/\/)?wa\.me\/(\d+)/g,
    '<a href="https://wa.me/$2" target="_blank" style="color:var(--a2);text-decoration:underline;">wa.me/$2</a>');

  // bare phone numbers (e.g. +255 618 811 359) -> tel: link
  escaped = escaped.replace(/(\+?\d[\d\s-]{7,}\d)/g, function (m) {
    var digits = m.replace(/[\s-]/g, '');
    return '<a href="tel:' + digits + '" style="color:var(--a2);text-decoration:underline;">' + m + '</a>';
  });

  return escaped;
}

    // ── AI call → /api/chat (Vercel serverless) ──────────────────────────────

    async function callAI(message) {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, history: chatHistory })
      });
      if (!res.ok) throw new Error('API ' + res.status);
      var data = await res.json();
      return data.reply;
    }

    // ── Main send ─────────────────────────────────────────────────────────────

    async function send() {
      if (isBusy) return;

      var inp = document.getElementById('inp');
      var text = inp.value.trim();
      if (!text) return;

      isBusy = true;
      inp.value = '';
      inp.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      addMsg(text, 'msg user');

      chatHistory.push({ role: 'user', content: text });
      if (chatHistory.length > 14) chatHistory = chatHistory.slice(-14);

      showTyping();

      var reply = '';

      try {
        reply = await callAI(text);
      } catch (err) {
        hideTyping();
        addMsg(
          '⚠️ Sorry, internet connection problem. Try again or Contact us: wa.me/255618811359',
          'msg error'
        );
        isBusy = false;
        document.getElementById('sendBtn').disabled = false;
        inp.focus();
        return;
      }

      hideTyping();

      chatHistory.push({ role: 'assistant', content: reply });

      addMsgHTML(linkify(reply), 'msg bot');

      isBusy = false;
      document.getElementById('sendBtn').disabled = false;
      inp.focus();
    }

    function ask(q) {
      if (isBusy) return;
      document.getElementById('inp').value = q;
      send();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function resize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
  </script>
